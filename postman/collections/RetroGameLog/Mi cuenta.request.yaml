$kind: http-request
description: Pide los datos propios usando el token guardado al entrar.
method: GET
url: '{{baseUrl}}/api/v1/me'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200: son los datos de la cuenta creada', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().email).to.eql(pm.collectionVariables.get('correo'));
      });
    language: text/javascript
