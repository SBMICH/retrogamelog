$kind: http-request
description: Una contraseña sin números no cumple las reglas.
method: POST
url: '{{baseUrl}}/api/v1/auth/register'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "debil_{{usuario}}@example.com",
      "username": "d_{{usuario}}",
      "password": "solamenteletras"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('422: la contraseña se rechaza', function () {
          pm.response.to.have.status(422);
          const error = pm.response.json().detail[0];
          pm.expect(error.loc).to.eql(['body', 'password']);
      });

      pm.test('El error no repite la contraseña', function () {
          pm.expect(pm.response.text()).to.not.include('solamenteletras');
      });
    language: text/javascript
