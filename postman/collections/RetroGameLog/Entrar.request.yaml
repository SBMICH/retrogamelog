$kind: http-request
description: >-
  Inicia sesión con la cuenta creada y guarda el token. El formulario llama "username" al campo,
  pero lleva el correo.
method: POST
url: '{{baseUrl}}/api/v1/auth/login'
order: 5000
body:
  type: urlencoded
  content:
    - key: username
      value: '{{correo}}'
    - key: password
      value: '{{clave}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200: sesión iniciada', function () {
          pm.response.to.have.status(200);
          const cuerpo = pm.response.json();
          pm.expect(cuerpo.token_type).to.eql('bearer');
          pm.expect(cuerpo.access_token).to.be.a('string').and.not.empty;
      });

      if (pm.response.code === 200) {
          pm.collectionVariables.set('token', pm.response.json().access_token);
      }
    language: text/javascript
