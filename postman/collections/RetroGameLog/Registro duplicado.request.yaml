$kind: http-request
description: Repite el registro con el mismo correo en mayúsculas. Debe rechazarse.
method: POST
url: '{{baseUrl}}/api/v1/auth/register'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{correoEnMayusculas}}",
      "username": "otro_{{usuario}}",
      "password": "{{clave}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const correo = pm.collectionVariables.get('correo') || '';
      pm.collectionVariables.set('correoEnMayusculas', correo.toUpperCase());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('409: el correo ya está registrado', function () {
          pm.response.to.have.status(409);
          pm.expect(pm.response.json().detail).to.include('email');
      });
    language: text/javascript
